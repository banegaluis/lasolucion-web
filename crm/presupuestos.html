<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Solución | Presupuestos</title>
<link rel="icon" href="assets/logo/logo.png">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/clientes.css"><link rel="stylesheet" href="css/presupuestos.css">
</head>
<body>
<main class="content clientes-page" id="presupuestosRoot" hidden>
<header class="clientes-hero"><div><p class="clientes-eyebrow">Gestión comercial</p><h1>Presupuestos</h1><p>Completá los datos y guardá el presupuesto como PDF desde la impresión.</p></div></header>
<form id="presupuestoForm" class="clientes-detail-card presupuesto-editor">
<div class="clientes-form-grid">
<label><span>Cliente / razón social</span><input id="cliente" required maxlength="160" autocomplete="organization"></label>
<label><span>Fecha</span><input id="fecha" type="date" required></label>
<label><span>Dirección (opcional)</span><input id="direccion" maxlength="240" autocomplete="street-address"></label>
<label><span>Rubro</span><select id="rubro"><option>Mantenimiento</option><option>Electricidad</option><option>Gas</option><option>Plomería</option><option>Refrigeración</option><option>Calefacción</option></select></label>
<label class="span-2"><span>Trabajo / alcance</span><textarea id="alcance" required maxlength="3000" rows="3"></textarea></label>
</div>
<h2>Conceptos</h2><div id="items"></div>
<button type="button" id="agregarItem" class="role-action-button">Agregar concepto</button>
<label class="clientes-full-field"><span>Condiciones (opcional)</span><textarea id="condiciones" rows="3" maxlength="3000" placeholder="Fecha a coordinar, forma de pago, vigencia, etc."></textarea></label>
<label class="presupuesto-check"><input id="estimado" type="checkbox"><span>Importe estimado</span></label>
<p class="presupuesto-total">Total: <strong id="total">$ 0</strong></p>
<div class="presupuesto-acciones"><button type="submit" class="dashboard-primary-action">Guardar como PDF / Imprimir</button><button type="button" id="guardarBorrador" class="role-action-button">Guardar borrador</button><button type="button" id="nuevo" class="role-action-button">Nuevo presupuesto</button><button type="button" id="ejemploArre" class="role-action-button">Cargar Arre Taquería</button></div>
<p id="estado" role="status">El borrador queda en este navegador. No se guarda en la nube.</p>
</form>
<section aria-label="Vista previa del presupuesto"><h2>Vista previa</h2><article id="documento" class="presupuesto-documento"></article></section>
</main>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/permisos.js"></script><script src="js/login.js?v=20261002-usuarios"></script><script src="js/config/supabase-config.js"></script><script src="js/services/supabaseClient.js"></script><script src="js/services/authService.js?v=20261002-usuarios"></script><script src="js/presupuestos.js"></script><script src="js/layout.js?v=20261007-presupuestos"></script>
</body></html>
